name: DSG images

on:
  push:
    branches: [dsg/release-0.4]
    paths:
      - "deploy/dsg/**"
      - "lib/alchemy-portless/**"
      - "otel/**"
      - ".github/workflows/dsg-images.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: registry.dsg.id
  OWNER: dsgid

jobs:
  build:
    # Builds on the Fringe runners: they sit behind NetBird and are already logged in to registry.dsg.id.
    runs-on: [self-hosted, Linux, X64, dsg-owned]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: maple-app
            dockerfile: deploy/dsg/Dockerfile.app
          - image: maple-collector
            dockerfile: otel/otel-collector.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:v0.4.0-dsg.${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest

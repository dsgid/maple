name: DSG images

on:
  push:
    branches: [main]
    paths:
      - "deploy/dsg/**"
      - "apps/ingest/**"
      - "lib/alchemy-portless/**"
      - "otel/**"
      - ".github/workflows/dsg-images.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: registry.dsg.id
  OWNER: dsgid

jobs:
  build:
    # Builds on the Fringe runners: they sit behind NetBird and are already logged in to registry.dsg.id.
    runs-on: [self-hosted, Linux, X64, dsg-owned]
    strategy:
      fail-fast: false
      # One at a time: Fringe is also the production host, and the Rust build is memory-hungry.
      max-parallel: 1
      matrix:
        include:
          - image: maple-app
            dockerfile: deploy/dsg/Dockerfile.app
            context: .
          - image: maple-collector
            dockerfile: otel/otel-collector.Dockerfile
            context: .
          - image: maple-ingest
            dockerfile: deploy/dsg/Dockerfile.ingest
            context: apps/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:main-dsg.${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
